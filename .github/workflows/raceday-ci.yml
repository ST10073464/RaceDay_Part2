name: RaceDay CI

on:
  push:
    branches:
      - master
      - POE

  pull_request:
    branches:
      - master
      - POE

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test RaceDay
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore RaceDay.slnx

      - name: Build RaceDay API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

      - name: Build RaceDay MVC
        run: dotnet build RaceDay.Mvc/RaceDay.Mvc.csproj --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build complete solution
        run: dotnet build RaceDay.slnx --configuration Release --no-restore